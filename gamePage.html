<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styleGame.css">
</head>

<body>

    <div class="div1">
        <span class="span1">Player-1 </span>
        <span class="span2" id="name1"></span>
        <span class="span3" id="score1">0</span>
    </div>

    <div class="div1">
        <span class="span1">Player-2 </span>
        <span class="span2" id="name2"></span>
        <span class="span3" id="score2">0</span>
    </div>

    <div class="div1">
        <span id="span4"></span>
    </div>

    <div class="board">
        <div id="cell00" class="cell"></div>
        <div id="cell01" class="cell"></div>
        <div id="cell02" class="cell"></div>

        <div id="cell10" class="cell"></div>
        <div id="cell11" class="cell"></div>
        <div id="cell12" class="cell"></div>

        <div id="cell20" class="cell"></div>
        <div id="cell21" class="cell"></div>
        <div id="cell22" class="cell"></div>
    </div>

    <script src="gameScript.js"></script>
</body>

</html>
